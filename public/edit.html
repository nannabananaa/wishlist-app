<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>edit · wishlist</title>
  <link rel="stylesheet" href="/styles.css">
  <link rel="icon" href="/favicon.ico">
</head>
<body>
  <main>
    <h1 class="page-title" style="margin-bottom:18px">edit ✏️</h1>
    <div class="cute-card">
      <div id="err" class="error-banner" style="display:none"></div>
      <form id="form" style="display:none">
        <div class="field">
          <label for="link">link</label>
          <input type="url" id="link" name="link" class="cute-input" required>
        </div>

        <div class="field">
          <label for="name">name</label>
          <input type="text" id="name" name="name" class="cute-input" maxlength="200" required>
        </div>

        <div class="field">
          <label for="price">price (optional)</label>
          <input type="number" id="price" name="price" class="cute-input" step="0.01" min="0">
        </div>

        <div class="field">
          <label>want level</label>
          <div class="want-input" id="wantInput"></div>
          <input type="hidden" name="wantLevel" id="wantLevel" value="3">
        </div>

        <div class="field">
          <label for="image">image (optional)</label>
          <input type="file" id="image" accept="image/*" class="cute-input">
          <img id="preview" class="image-preview" style="display:none" alt="preview">
          <div id="imgControls" class="image-controls" style="display:none">
            <button type="button" id="removeImg" class="cute-btn-ghost">remove image</button>
          </div>
        </div>

        <div style="display:flex; gap:10px; flex-wrap:wrap; align-items:center">
          <button type="submit" id="saveBtn" class="cute-btn">save 💖</button>
          <a href="/" class="cute-btn-ghost">cancel</a>
          <button type="button" id="deleteBtn" class="cute-btn-ghost" style="margin-left:auto; color:#c43030">🗑️ delete</button>
        </div>
      </form>
      <p id="loading" style="text-align:center; color:var(--ink-soft);">loading…</p>
    </div>
  </main>
  <footer>🎀 made with love</footer>

  <script type="module">
    import { api, requireUser, mountHeader, fileToDataUrl, showError, clearError } from '/app.js';

    const id = Number(new URLSearchParams(location.search).get('id'));
    let imageData = null;
    let clearImage = false;
    let originalImage = null;

    async function init() {
      if (!Number.isInteger(id) || id <= 0) {
        window.location.href = '/';
        return;
      }
      const user = await requireUser();
      mountHeader(user, 'home');

      const item = await api(`/api/items/${id}`);
      if (item.addedBy !== user) {
        showError(document.getElementById('err'), "you can't edit this item");
        document.getElementById('loading').style.display = 'none';
        return;
      }
      if (item.status === 'gifted') {
        showError(document.getElementById('err'), "this item has been gifted — it's locked");
        document.getElementById('loading').style.display = 'none';
        return;
      }

      // Want level pills
      const wantInput = document.getElementById('wantInput');
      const wantHidden = document.getElementById('wantLevel');
      const labels = ['😐 meh', '🙂 nice', '😍 want', '🤩 really want', '🚨 NEED'];
      function setWant(v) {
        wantHidden.value = v;
        for (const b of wantInput.children) {
          b.classList.toggle('active', Number(b.dataset.v) === v);
        }
      }
      for (let i = 1; i <= 5; i++) {
        const b = document.createElement('button');
        b.type = 'button';
        b.dataset.v = i;
        b.textContent = labels[i - 1];
        b.addEventListener('click', () => setWant(i));
        wantInput.appendChild(b);
      }

      // Populate
      document.getElementById('link').value = item.link || '';
      document.getElementById('name').value = item.name || '';
      document.getElementById('price').value = item.price == null ? '' : String(item.price);
      setWant(item.wantLevel || 3);

      const preview = document.getElementById('preview');
      const imgControls = document.getElementById('imgControls');
      originalImage = item.imageUrl;
      if (item.imageUrl) {
        preview.src = item.imageUrl;
        preview.style.display = 'block';
        imgControls.style.display = 'flex';
      }

      const imgInput = document.getElementById('image');
      imgInput.addEventListener('change', async () => {
        const f = imgInput.files?.[0];
        if (!f) return;
        if (f.size > 4 * 1024 * 1024) {
          alert('Image too big — max 4MB');
          imgInput.value = '';
          return;
        }
        imageData = await fileToDataUrl(f);
        clearImage = false;
        preview.src = imageData;
        preview.style.display = 'block';
        imgControls.style.display = 'flex';
      });

      document.getElementById('removeImg').addEventListener('click', () => {
        imageData = null;
        clearImage = true;
        preview.style.display = 'none';
        preview.src = '';
        imgInput.value = '';
        imgControls.style.display = 'none';
      });

      // Submit
      const err = document.getElementById('err');
      const saveBtn = document.getElementById('saveBtn');
      document.getElementById('form').addEventListener('submit', async (e) => {
        e.preventDefault();
        clearError(err);
        saveBtn.disabled = true;
        const fd = new FormData(e.target);
        try {
          await api(`/api/items/${id}`, {
            method: 'PUT',
            body: {
              name: fd.get('name'),
              link: fd.get('link'),
              price: fd.get('price') === '' ? null : Number(fd.get('price')),
              wantLevel: Number(fd.get('wantLevel')),
              imageUrl: imageData,  // null = leave existing image alone (server falls through)
              clearImage,
            },
          });
          window.location.href = '/';
        } catch (ex) {
          showError(err, ex.message);
          saveBtn.disabled = false;
        }
      });

      document.getElementById('deleteBtn').addEventListener('click', async () => {
        if (!confirm('Delete this item?')) return;
        try {
          await api(`/api/items/${id}`, { method: 'DELETE' });
          window.location.href = '/';
        } catch (ex) {
          showError(err, ex.message);
        }
      });

      document.getElementById('loading').style.display = 'none';
      document.getElementById('form').style.display = 'block';
    }

    init().catch((e) => {
      console.error(e);
      document.getElementById('loading').textContent = 'error: ' + e.message;
    });
  </script>
</body>
</html>
